{% extends "base.html" %}
{% block title %}{{ code }} - 出错了{% endblock %}
{% block content %}
<div style="max-width:560px;margin:60px auto;text-align:center;background:#f5f0e8;border:1px solid #e0e0e0;border-radius:10px;padding:50px 30px;">
    <div style="font-size:52px;font-weight:700;color:#b8973e;line-height:1;">{{ code }}</div>
    <p style="color:#555;font-size:1.05rem;margin:16px 0 8px;">{{ message }}</p>
    <p style="color:#999;font-size:0.85rem;margin:0 0 24px;">如果问题持续出现，请联系管理员</p>
    <a href="{{ url_for('main.dashboard') }}"
       style="display:inline-block;padding:10px 30px;background:#b8973e;color:#fff;border:none;border-radius:6px;font-weight:700;text-decoration:none;cursor:pointer;">返回首页</a>
</div>
{% endblock %}
